name: Build static bwrap binaries

on:
  release:
    types:
      - published
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build static bwrap for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static bwrap image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: bwrap-static:${{ matrix.arch }}

      - name: Extract binary
        run: |
          mkdir -p dist
          docker run --rm bwrap-static:${{ matrix.arch }} cat /bwrap > dist/bwrap-${{ matrix.arch }}
          chmod +x dist/bwrap-${{ matrix.arch }}

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$RELEASE" --json id >/dev/null 2>&1; then
            gh release upload "$RELEASE" dist/bwrap-${{ matrix.arch }} --clobber
          else
            gh release create "$RELEASE" dist/bwrap-${{ matrix.arch }} --generate-notes --title "$RELEASE"
          fi
